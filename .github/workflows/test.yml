name: test

on:
  push:
  pull_request:

jobs:
  python-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Install Python 3.14
        run: uv python install 3.14
      - name: Run unit tests
        run: uv run pytest
