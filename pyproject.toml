[project]
name = "docgen"
version = "0.1.0"
description = "Generate Contoso Demo Bank credit-policy documents and upload them to Cloud Storage."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.1",
    "google-adk>=2.9.2,<3",
    "google-auth>=2.40",
    "google-cloud-storage>=2.19",
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
    "requests>=2.32.0",
]

[project.scripts]
docgen = "docgen.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
default-groups = ["dev"]
python-preference = "managed"

[tool.ruff]
target-version = "py314"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
addopts = "-m unit"
markers = [
    "unit: corpus contract and CLI tests, no Google Cloud",
    "ingestion: live Cloud Storage + Agent Search indexed counts",
    "retrieval: live Agent Search retrieve",
    "agent: live judgement through https://credit-policy.ai.lab5.ca",
    "teams: Google Chat live path",
]
testpaths = ["tests"]
timeout = 180
